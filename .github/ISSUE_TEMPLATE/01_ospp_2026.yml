name: "开源之夏 2026 项目提交 (仅中文)"
description: "使用中文提交开源之夏 2026 项目信息。"
title: "项目名称"
labels: ["Community: OSPP"]
body:
  - type: markdown
    attributes:
      value: |
        本模板仅用于支持中文报名的项目。请完整填写项目资料。领航模式项目须填写关联方向、学生邮箱及 Pitch 凭证。


        ---
  - type: dropdown
    id: project_type
    attributes:
      label: 项目类型
      description: 请选择本次提交的项目类型。
      options:
        - 经典模式项目
        - 领航模式项目
    validations:
      required: true

  - type: input
    id: project_name
    attributes:
      label: 项目名称
      description: 名称应清晰体现技术和目标任务，不使用逗号等断句。
      placeholder: 例如：面向 RISC-V64 的 xxx
    validations:
      required: true

  - type: textarea
    id: mentors
    attributes:
      label: 项目导师
      description: 填写导师姓名、在 openRuyi 组织内贡献时使用的邮箱，以及导师贡献的 openRuyi 仓库地址。
      placeholder: |
        导师姓名:
        导师邮箱:
        导师贡献的 openRuyi 仓库地址:
    validations:
      required: true

  - type: textarea
    id: project_description
    attributes:
      label: 项目描述
      description: 请围绕相关背景、已有工作、存在的不足、希望改进的点以及最终项目实现的目标进行说明，并用一段逻辑连贯的文字完整表述，不要分别设置小节。
      placeholder: |
        请在此填写完整的项目描述
    validations:
      required: true

  - type: textarea
    id: project_notes
    attributes:
      label: 项目备注
      description: 填写其他需要说明的事项；无内容请填写“无”。
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 项目综合难度
      description: 经典模式和组织支持项目选择“基础”或“进阶”；“挑战”仅适用于领航模式项目。
      options:
        - 基础
        - 进阶
        - 挑战
    validations:
      required: true

  - type: dropdown
    id: development_cycle
    attributes:
      label: 开发周期
      options:
        - 2个月
        - 3个月
        - 4个月
    validations:
      required: true

  - type: dropdown
    id: technical_domains
    attributes:
      label: 技术领域标签
      description: 可选择一个或多个技术领域。
      multiple: true
      options:
        - 开源芯片
        - 应用软件开发
        - 大数据与人工智能
        - 开发和运维
        - 分布式系统
        - 操作系统与基础软件
        - 网络与安全
        - 编程语言
    validations:
      required: true

  - type: input
    id: secondary_technical_domain_tags
    attributes:
      label: 二级技术领域标签
      description: 请填写与所选技术领域对应的二级标签，多个标签请用英文逗号分隔。
      placeholder: React, PyTorch, Linux
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        请展开所选技术领域查看可选的二级标签。
        <details>
        <summary>开源芯片</summary>
        Chip Design/Verification
        </details>

        <details>
        <summary>应用软件开发</summary>
        Adobe XD, Alamofire, Android Jetpack, AndroidX, Angular, Apache, ASP.NET, AWS Mobile Hub, Babel, Bootstrap, 
        Code Review, Core Location, CoreData, Dapr, Desktop Application, Django, dotnetcore, Electron, Express.js, Figma, 
        Firebase, Flutter, GraphQL, GTK, Hugo, Ionic, JavaFX, Jekyll, Laravel, Material UI, 
        Memcached, MFC, Netflix OSS, Mobile Application, Nginx, npm, Parcel, PyQt, Qt, React, 
        React Native, RESTful API, Retrofit, Ruby on Rails, Sass, Sketch, Spring Boot, Spring Cloud, Tkinter, UI, 
        UIKit, UWP, UX, Vue.js, Webpack, Web Application, Windows Presentation Foundation (WPF), WinForms, Xamarin, Yarn, 
        .NET, .Net Core
        </details>

        <details>
        <summary>大数据与人工智能</summary>
        AI, AlexNet, BERT, C3D, CNN, Computer Vision(CV), ConceptNet, CoreNLP, Database, Data Science, 
        Deep Learning, Documented Database, Embedded Database, Fairseq, Faster R-CNN, Flink, GAN, GPT, GPU, GRU, 
        Graph Database, Hadoop, Hbase, HDFS, Hive, HPC, Hugging Face Transformers, I3D, jieba, Kafka, 
        KCF, Keras, LLM, LSTM, Matplotlib, Machine Learning, MongoDB, MOSSE, MySQL, Natural Language Processing (NLP), 
        NLTK, Non-relational Database, NumPy, Open3D, OpenCV, OpenCL, OpenIE, OpenNMT, Pandas, PCA, 
        PCL, PIL, Plotly, PostgreSQL, Power BI, PySceneDetect, PyTorch, Quantization, ResNet, Relational Database, 
        Scientific Computing, Semantic Kernel, scikit-image, Scikit-learn, SciPy, Seaborn, SiamFC, SiamRPN, spaCy, Spark, 
        SSD, Stanford NER, Structured Database, Tableau, TensorFlow, TextRank, Unstructured Database, Vector Database, VGG, VIA, 
        WordNet, YOLO
        </details>

        <details>
        <summary>开发和运维</summary>
        AIOps, Appium, CD, CI, CircleCI, Cucumber, DataOps, DevOps, DevSecOps, ELK Stack, 
        FinOps, Git, GitLab CI/CD, Grafana, Jenkins, JMeter, Junit, LLMOps, LoadRunner, MLOps, 
        Postman, Prometheus, pytest, Selenium, SoapUI, SVN, Travis CI
        </details>

        <details>
        <summary>分布式系统</summary>
        Amazon SQS, AmazonDynamoDB, Apache Mesos, AWS IoT, Azure IoT, Bitcoin, Blockchain, Cassandra, Ceph, Cloud Native, 
        CubeFS, Distributed Storage, Docker, Docker Compose, Elasticsearch, Ethereum, Flink, GlusterFS, Google Cloud IoT, Grafana, 
        Hadoop, Hazelcast, HDFS, IPFS (InterPlanetary File System), Kafka, Kibana, Kubernetes, Logstash, Memcached, Prometheus, 
        Proof of Work (PoW), RabbitMQ, Redis, Self-sovereign Identity (SSI), Spark, Truffle, Web3.js, ZooKeeper
        </details>

        <details>
        <summary>操作系统与基础软件</summary>
        Ansible, ARM, AVR, CentOS, Cgroups, Clang, Compiler, classic-flang, DBus, Debian, 
        DTK, Emulation, ext4, Fedora, FreeRTOS, FUSE, GCC, GDB, GNU, KVM, 
        Linux, LLVM, Perf, PIC, QEMU, RISC-V, RTOS, ThreadX, Ubuntu, Virtualization, 
        Wayland, Window Manager, x86
        </details>

        <details>
        <summary>网络与安全</summary>
        802.1X, AES, CDMA, CDN, Cryptography, DHCP, DNS, EAP, ELKStack, FTP, 
        GSM, HTTP, IDS/IPS, iptables, JWT, LDAP, libcurl, LTE, MQTT, Netty, 
        OAuth, OpenIDConnect, PKI, RSA, SAML, SCP, SFTP, SIEM, Snort, Socket, 
        SSL/TLS, Suricata, TCP/IP, tcpdump, VPN, WebSocket, Wireshark, WPA/WPA2
        </details>

        <details>
        <summary>编程语言</summary>
        Programming Language
        </details>

  - type: input
    id: programming_languages
    attributes:
      label: 编程语言标签
      description: 请用英文逗号分隔多个语言。
      placeholder: C, C++, Rust
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 项目产出要求
      description: 明确学生需完成的工作和预期效果；每项建议控制在 30 字以内。
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: technical_requirements
    attributes:
      label: 项目技术要求
      description: 从编程语言、技术栈和开发经验描述要求。每项建议控制在 30 字以内。
      placeholder: |
        1. 熟悉……
        2. 掌握……
        3. 了解……
    validations:
      required: true

  - type: input
    id: output_repository
    attributes:
      label: 项目成果仓库 (PR 提交地址)
      description: 填写组织已有仓库的完整 URL；多个仓库请用英文逗号分隔，勿填写 URL 以外的内容。
      placeholder: https://github.com/openRuyi-Project/ospp
    validations:
      required: true

  - type: input
    id: repository_license
    attributes:
      label: 项目成果仓库开源协议
      description: 填写成果仓库使用的开源协议。
      placeholder: Apache-2.0
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我确认所填信息完整准确，并已按所选项目类型填写对应内容。
          required: true
